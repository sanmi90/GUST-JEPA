# Canonical: matched autoencoder, lift + wake supervision.
# Track C row ae_wake (reconstruction + lift + wake, matched arch). Anti-collapse
# held ON (sigreg) to match jepa_wake across the recon-vs-predict contrast.
name: ae_wake

representation_objective:
  recon: {on: true}

anti_collapse:
  on: true
  method: sigreg

supervision:
  lift_head: {on: true}
  wake_head: {on: true}
