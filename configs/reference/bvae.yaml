# Reference: Solera-Rico beta-VAE stochastic-latent baseline (own architecture).
# Track C row bvae.
#
# PENDING: Carlos supplies the final recipe (beta at the L-curve elbow; wake head
# TBC). The native objective is MSE recon + beta*KL, which the kit's frozen
# recon.loss (plain MSE) cannot express. This stub records only the active-term
# set (recon + native lift) so the audit can render a row; the audit flags it as
# PENDING. It is loadable (valid under the four rules) but is NOT a kit-faithful
# model: the KL term lives in the native bvae trainer, not in the kit.
name: bvae

representation_objective:
  recon: {on: true}

anti_collapse:
  on: false

supervision:
  lift_head: {on: true}     # native lift augmentation
  wake_head: {on: false}    # TBC: Carlos decides whether bvae carries wake

model:
  encoder: bvae_native
  latent: stochastic
