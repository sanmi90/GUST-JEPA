# Reference: Solera-Rico beta-VAE stochastic-latent baseline (own architecture).
# Track C / Session 32 Track P row bvae. Pooled-native (stochastic d-vector latent).
#
# RESOLVED (Session 32, D218): beta = 0.0025 (canonical sum-KL; v2.1 L-curve knee,
# outputs/session28/bvae_beta_pin.json), beta_warmup_frac = 0.02, WITH the 80-d
# patch_signed_spectrum wake head (parallels fukami_wake). The native objective is
# MSE recon + beta*KL (+ lift + wake), which lives in the native bvae trainer, NOT
# in the kit's frozen recon.loss; this file records the active-term set so the audit
# renders the row. Training entrypoint is scripts/session9_train_fukami.py with
#   --vae --beta 0.0025 --beta-warmup-frac 0.02 --recon-loss-type mse
#   --wake-observable-type patch_signed_spectrum --wake-loss smooth_l1 --wake-loss-beta 0.5
#   --encoder cnn --d 32 --partition v2p2   (beta passed on the CLI, not read here).
# Caveat: the 0.0025 knee was picked at d=64 on v2.1; transfer to d=32 on v2.2 is a
# low-risk assumption, guarded by the D218 re-sweep trigger (>half dims KL<0.01 nats,
# or decode-floor VRMSE worse than fukami_wake).
name: bvae

representation_objective:
  recon: {on: true}

anti_collapse:
  on: false

supervision:
  lift_head: {on: true}     # native lift augmentation
  wake_head: {on: true}     # D218: bvae carries the 80-d spectral wake head

# Native beta-VAE recipe (consumed by the native trainer; here for provenance).
bvae:
  beta: 0.0025
  beta_warmup_frac: 0.02
  kl_convention: canonical_sum   # Higgins 2017 / Nat. Commun. Eq. (4)

model:
  encoder: bvae_native
  latent: stochastic
