# Ablation: ae_nowake switch-set, pooled-vector latent (vs the canonical spatial).
# Session 32 Track P: pooled coefficient tier. Only the latent flag moves versus
# ae_nowake (canonical spatial).
name: ae_nowake_pool

representation_objective:
  recon: {on: true}

anti_collapse:
  on: true
  method: sigreg

supervision:
  lift_head: {on: true}
  wake_head: {on: false}

model:
  encoder: cnn_vit
  latent: pooled
