# Track C cell CLWN (Session 34): pooled JEPA, all three heads (L + W + N).
# Completes the 2x2x2 conditioning cube for the interaction analysis.
name: jepa_pool_lwn

representation_objective:
  pred: {on: true}

anti_collapse:
  on: true
  method: sigreg

supervision:
  lift_head: {on: true}
  wake_head: {on: true}
  nearbody_head: {on: true}

model:
  encoder: cnn_vit
  latent: pooled
