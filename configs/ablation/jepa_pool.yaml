# Ablation: jepa_wake switch-set, pooled-vector latent (vs the canonical spatial).
# Track E: is the spatial latent the lever. Only the latent flag moves versus
# jepa_wake.
name: jepa_pool

representation_objective:
  pred: {on: true}

anti_collapse:
  on: true
  method: sigreg

supervision:
  lift_head: {on: true}
  wake_head: {on: true}

model:
  encoder: cnn_vit
  latent: pooled
