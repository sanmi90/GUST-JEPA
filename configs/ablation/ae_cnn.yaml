# Ablation: ae_nowake switch-set, CNN-only encoder (drop the ViT).
# Track E rung 1, reconstruction side.
name: ae_cnn

representation_objective:
  recon: {on: true}

anti_collapse:
  on: true
  method: sigreg

supervision:
  lift_head: {on: true}
  wake_head: {on: false}

model:
  encoder: cnn_only
  latent: spatial
