# Ablation: spatio-temporal encoder (CNN+ViT + temporal conv, kernel=3 over time).
# Track E rung 3: does temporal convolution beat pure spatial. Built on the
# predictive switch-set (= jepa_nowake) so the ONLY axis moved versus jepa_nowake
# is the encoder flag; it co-trains a predictor and is read out with the matched
# predictor in Track D to stay apples-to-apples.
name: st_d64

representation_objective:
  pred: {on: true}

anti_collapse:
  on: true
  method: sigreg

supervision:
  lift_head: {on: true}
  wake_head: {on: false}

model:
  encoder: cnn_vit_temporal
  latent: spatial
