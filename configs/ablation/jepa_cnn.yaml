# Ablation: jepa_nowake switch-set, CNN-only encoder (drop the ViT).
# Track E rung 1: does the ViT contribute anything (v2.1 said no).
name: jepa_cnn

representation_objective:
  pred: {on: true}

anti_collapse:
  on: true
  method: sigreg

supervision:
  lift_head: {on: true}
  wake_head: {on: false}

model:
  encoder: cnn_only
  latent: spatial
